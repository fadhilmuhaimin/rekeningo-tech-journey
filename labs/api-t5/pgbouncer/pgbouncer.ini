; PgBouncer di depan primary lab api-t5: mode transaction. Nilai {...} diisi run.py sebelum container dijalankan.
; Password di userlist.txt adalah data lab lokal, bukan secret.
[databases]
lab = host=host.docker.internal port={db_port} dbname=lab

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = lab
pool_mode = transaction
; Server connection per pasangan (database, user): paling banyak 20, jauh di bawah max_connections - 3 = 97.
default_pool_size = 20
max_client_conn = 1000
; Prepared statement protokol extended (pgx) di mode transaction butuh nilai > 0 (PgBouncer 1.21 ke atas).
max_prepared_statements = 100
server_idle_timeout = 600
