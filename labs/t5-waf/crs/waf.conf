# Konfigurasi WAF lab t5-waf (milik lab; bukan bagian rilis CRS). Dimuat Coraza lewat `Include waf.conf`; jalur di bawah
# relatif terhadap folder crs/. Mesin (On atau DetectionOnly) dipasang gerbang sesudah Include ini.
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecRequestBodyLimit 65536
SecRequestBodyInMemoryLimit 65536
SecRequestBodyLimitAction Reject
SecAuditEngine Off

# Body JSON dibaca sebagai argumen (CRS memeriksa ARGS, bukan byte mentah). Pola sama dengan coraza.conf-recommended
# (Coraza v3.8.1, Apache-2.0).
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
    "id:'200001',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQBODY_ERROR "!@eq 0" \
    "id:'200002',phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',logdata:'%{reqbody_error_msg}',severity:2"

# Setelan CRS: berkas rilis tanpa perubahan, lalu dua ketetapan lab yang ditulis eksplisit (nilainya sama dengan bawaan CRS
# 4.30.0): paranoia level 1 dan ambang anomali masuk 5 (satu temuan critical = 5 poin).
Include crs-setup.conf
SecAction "id:900000,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',ver:'OWASP_CRS/4.30.0',setvar:tx.blocking_paranoia_level=1"
SecAction "id:900110,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',ver:'OWASP_CRS/4.30.0',setvar:tx.inbound_anomaly_score_threshold=5,setvar:tx.outbound_anomaly_score_threshold=4"
Include rules/*.conf
