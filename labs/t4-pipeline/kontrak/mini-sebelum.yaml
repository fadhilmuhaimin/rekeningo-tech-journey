    parameters:
      - { name: batas, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      - { name: tag, in: query, required: false, schema: { type: array, items: { type: string } }, style: form, explode: true }
    get:
      operationId: riwayat
      responses:
        '200': { description: ok }
  /laporan:
    get:
      operationId: laporan
      parameters:
        - { name: batas, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: tag, in: query, required: false, schema: { type: array, items: { type: string } }, style: form, explode: true }
      responses:
        '200': { description: ok }
