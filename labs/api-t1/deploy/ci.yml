# Lab 1.31 · CI pertama repo Rekeningo (keputusan 247). Contoh berkas; tidak dijalankan di repo panduan ini.
# Setiap push ke main: periksa kode, lalu image bertag hash commit dikirim ke registry.
# Deploy tetap satu perintah di VPS: TAG=<hash commit> docker compose up -d
name: ci
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  periksa-dan-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # ADR 11: gitleaks memindai seluruh riwayat, bukan satu commit
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -include=G201,G202 ./...
      # ADR 11 (1.35): .gitleaks.toml dan .gitleaksignore dibaca dari root repo. Hook di laptop bisa dilewati; langkah ini tidak.
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact -v .
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # github.sha = hash commit penuh; context github tidak punya versi pendek. Tag = 7 karakter pertama, sama dengan lab.
      - run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          push: true
          # Nama image wajib huruf kecil.
          tags: ghcr.io/grup-lestari/rekeningo-api:${{ env.TAG }}
