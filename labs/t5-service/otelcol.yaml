# OpenTelemetry Collector (distribusi contrib 0.163.2) untuk lab t5-service: terima span lewat OTLP/HTTP, putuskan
# per trace sesudah semua span-nya datang (tail sampling), tulis yang disimpan ke berkas. Semua lokal, tanpa jaringan keluar.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  tail_sampling:
    decision_wait: 3s
    num_traces: 1000
    expected_new_traces_per_sec: 100
    policies:
      - name: trace-berkesalahan
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: sisanya-sebagian
        type: probabilistic
        probabilistic:
          sampling_percentage: 5

exporters:
  file:
    path: /jejak/jejak.json

service:
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling]
      exporters: [file]
