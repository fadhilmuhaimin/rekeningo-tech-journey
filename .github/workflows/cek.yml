# Gerbang kualitas yang sama dengan laptop, dijalankan di setiap PR dan setiap push ke main.
# Laptop menjalankan `tools/cek_situs.sh --layar` (keputusan 111). Di CI pemeriksaan yang sama dibagi:
# job build menjalankan bagian tanpa browser dan membangun dist sekali, lalu satu job per kelompok alat ukur
# Playwright berjalan paralel atas dist itu (keputusan 357). Yang disiapkan di sini hanya lingkungannya
# (Node 22, bun, Chromium Playwright, font). MkDocs dihapus (keputusan 112).
# Versi action dicek ke halaman rilis masing-masing pada 2026-10-08 (keputusan 99).
# Keputusan 865 (CI lebih cepat tanpa mengurangi cakupan): (1) kelompok alat ukur dibagi per ukuran layar menjadi tujuh job
# (lihat KELOMPOK_UKUR); (2) cache browser Playwright (keputusan 865; cache bun dicoba dan dibuang: lebih lambat dari pemasangan); (3) di PR, alat ukur yang memeriksa semua halaman
# hanya memeriksa halaman yang berubah terhadap dist main yang lolos (tools/pilih_halaman.py; bawaan semua halaman, ragu = semua,
# keputusan 866); (4) push ke main, jadwal malam, dan workflow_dispatch memeriksa 100% halaman (keputusan 867).
name: cek

on:
  pull_request:
  push:
    branches: [main, 'percobaan/**']   # branch percobaan ikut dicek tanpa membuka PR
  workflow_dispatch:
  # Pemeriksaan 100% halaman tiap malam (02:17 WITA), jaring pengaman untuk pemilihan halaman di PR (keputusan 867). Cron memakai UTC.
  schedule:
    - cron: "17 18 * * *"

# PR: run lama dibatalkan saat commit baru masuk (hemat menit). Main dan percobaan: tiap run punya grup sendiri
# dan tidak pernah dibatalkan, supaya setiap merge diverifikasi sendiri. Satu grup bersama membuat run yang
# menunggu digantikan run yang lebih baru walau cancel-in-progress false (dokumen GitHub "Using concurrency",
# dicek 2026-10-24); karena itu grup push memakai github.run_id (keputusan 727).
concurrency:
  group: cek-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pesan_commit:
    name: pesan commit
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # butuh seluruh commit PR, bukan hanya HEAD
      # CLAUDE.md "commit": tanpa trailer Co-Authored-By dan tanpa tanda alat AI (keputusan 110).
      # "Claude" dicari peka huruf besar supaya nama file CLAUDE.md di pesan tetap boleh.
      - name: Tolak trailer dan tanda AI di pesan commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gagal=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            pesan=$(git log -1 --format=%B "$sha")
            if printf '%s' "$pesan" | grep -qiE 'co-authored-by' || printf '%s' "$pesan" | grep -qE 'Claude'; then
              echo "::error::Pesan commit $sha mengandung Co-Authored-By atau Claude"
              printf '%s\n' "$pesan"
              gagal=1
            fi
          done
          exit $gagal

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # memindai seluruh riwayat, bukan hanya commit terakhir
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # Bagian tanpa browser: registry, istilah, audit bahasa, build strict, ID internal, kontras dua mode, tipe, tes.
  situs_baru:
    name: situs (Astro) build
    runs-on: ubuntu-latest
    # Sebelum keputusan 357 satu job menjalankan semuanya: 14m47-15m36 di PR #189/#195.
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read   # unduh situs-dist dari run main terakhir yang lolos (pemilihan halaman PR, keputusan 866)
    outputs:
      matriks: ${{ steps.matriks.outputs.matriks }}
    steps:
      - uses: actions/checkout@v7
      # Node tetap dipakai untuk astro, Playwright, dan node:test; bun hanya pemasang paket
      # dan penjalan skrip (keputusan 225). Versi bun dipin sama dengan yang membuat bun.lock.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      # Langkah unduh dan pasang ikut dibatasi `timeout`: jaringan yang macet di sini juga berakhir `failure`,
      # bukan `cancelled` oleh timeout job (keputusan 360). Normalnya beberapa detik.
      - name: Unduh font
        run: timeout -k 15s 2m bash tools/get_fonts.sh
      # Cache unduhan bun sengaja tidak dipakai (keputusan 865): dicoba di PR #328 run 40153595166, memulihkan 131 MB memakan 4 s
      # per job, sedangkan `bun install --frozen-lockfile` tanpa cache 1-3 s (run 40148968969), jadi cache itu memperlambat.
      - name: Pasang dependency
        run: timeout -k 15s 2m bun install --cwd situs --frozen-lockfile
      # Batas waktu langkah di bawah timeout job. Job yang kena timeout-minutes berakhir `cancelled`, dan
      # `gh pr checks` menghitung cancelled terpisah dari gagal, jadi gerbang yang macet terbaca hijau.
      # timeout (GNU coreutils) keluar 124, atau 137 bila perlu KILL, jadi langkahnya `failure` (keputusan 357).
      - name: Gerbang kualitas situs tanpa browser
        run: timeout -k 30s 5m bash tools/cek_situs.sh
      # Pemilihan halaman untuk alat ukur (keputusan 866). Dasar = dist dari run push main terbaru yang seluruh jobnya hijau:
      # run itu memeriksa 100% halaman, jadi halaman yang HTML-nya sama dengan dasar sudah terbukti lolos. Basis perbandingan
      # berkas sumber adalah commit dasar itu (bukan base PR), jadi perubahan alat ukur di main sesudah dasar juga terhitung.
      # Gagal mengunduh (tidak ada run, artefak kedaluwarsa 3 hari, commit tidak terambil) = semua halaman.
      - name: Unduh dist main yang lolos sebagai dasar
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baris=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow cek.yml --branch main --event push --status success --limit 1 \
            --json databaseId,headSha --jq '.[0] | select(. != null) | "\(.databaseId) \(.headSha)"' || true)
          read -r id sha <<<"$baris" || true
          if [ -z "${id:-}" ] || [ -z "${sha:-}" ]; then echo "::notice::Tidak ada run main yang lolos; semua halaman diperiksa."; exit 0; fi
          mkdir -p tmp/dasar
          if ! timeout -k 15s 2m gh run download "$id" --repo "$GITHUB_REPOSITORY" -n situs-dist -D tmp/dasar; then
            echo "::notice::Artefak situs-dist run $id tidak bisa diunduh (kedaluwarsa?); semua halaman diperiksa."; rm -rf tmp/dasar; exit 0
          fi
          if ! timeout -k 15s 2m git fetch --no-tags --depth=1 origin "$sha"; then
            echo "::notice::Commit dasar $sha tidak bisa diambil; semua halaman diperiksa."; rm -rf tmp/dasar; exit 0
          fi
          echo "$sha" > tmp/dasar-sha.txt
          echo "Dasar: run $id, commit $sha"
      - name: Pilih halaman yang diperiksa alat ukur
        env:
          PERISTIWA: ${{ github.event_name }}
        run: |
          set -o pipefail
          mkdir -p tmp/pilihan
          basis=""; if [ -f tmp/dasar-sha.txt ]; then basis=$(cat tmp/dasar-sha.txt); fi
          python3 tools/pilih_halaman.py --peristiwa "$PERISTIWA" --dist situs/dist --dasar tmp/dasar --basis "$basis" \
            --keluar tmp/pilihan/halaman-diperiksa.txt | tee tmp/pilihan/ringkasan.txt
          if [ -f tmp/pilihan/halaman-diperiksa.txt ]; then echo sebagian > tmp/pilihan/mode.txt; else echo semua > tmp/pilihan/mode.txt; fi
          { echo "### Halaman yang diperiksa alat ukur"; echo '```'; cat tmp/pilihan/ringkasan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: pilihan-halaman
          path: tmp/pilihan
          retention-days: 3
      # Daftar kelompok diambil dari skrip yang sama dengan laptop, jadi CI tidak bisa melewatkan alat ukur.
      - name: Kelompok alat ukur
        id: matriks
        run: echo "matriks=$(bash tools/cek_situs.sh --matriks-ci)" >> "$GITHUB_OUTPUT"
      # Satu build untuk semua alat ukur dan untuk job deploy, supaya yang di-deploy sama dengan yang diperiksa.
      - uses: actions/upload-artifact@v7
        with:
          name: situs-dist
          path: situs/dist
          retention-days: 3

  # Alat ukur Playwright, satu kelompok per job, paralel atas dist dari job build (keputusan 357).
  situs_ukur:
    name: situs (Astro) ukur ${{ matrix.kelompok }}
    needs: situs_baru
    runs-on: ubuntu-latest
    # Kelompok terlama ±5m15 alat + ±1 menit persiapan di PR #195; +6 menit cadangan mirror apt lambat (keputusan 563).
    timeout-minutes: 18
    strategy:
      fail-fast: false   # kelompok lain tetap melapor walau satu gagal
      matrix: ${{ fromJSON(needs.situs_baru.outputs.matriks) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      # Dibatasi seperti di job build (keputusan 360); Chromium dengan dependency sistem normalnya 21–41 s.
      # Mirror apt Azure ±60 KB/s pada 2026-10-24 membuat paket font dependency melewati 3 menit di tiga run berturut-turut (keputusan 563).
      - name: Pasang dependency
        run: timeout -k 15s 2m bun install --cwd situs --frozen-lockfile
      # Paket .deb dependency Chromium (±26 MB, kebanyakan font) disimpan di cache Actions, jadi mirror apt yang
      # lambat tidak lagi menentukan lama langkah pasang (keputusan 683). Kunci: image runner (ImageOS dan
      # ImageVersion, dipasang image GitHub di /etc/environment) dan versi playwright-core di lockfile, yang
      # menentukan daftar paketnya. Image baru memulihkan cache image lama lewat restore-keys.
      - name: Kunci cache apt Chromium
        id: kunci_apt
        run: |
          versi=$(grep -o '"playwright-core@[0-9][0-9.]*"' situs/bun.lock | head -1 | tr -d '"')
          test -n "$versi" || { echo "::error::playwright-core tidak ada di situs/bun.lock"; exit 1; }
          echo "kunci_browser=playwright-browser-${ImageOS:?bukan runner GitHub-hosted}-$versi" >> "$GITHUB_OUTPUT"
          echo "awalan=apt-chromium-${ImageOS:?bukan runner GitHub-hosted}-" >> "$GITHUB_OUTPUT"
          echo "kunci=apt-chromium-${ImageOS}-${ImageVersion:?bukan runner GitHub-hosted}-$versi" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: cache_apt
        with:
          path: ~/apt-chromium
          key: ${{ steps.kunci_apt.outputs.kunci }}
          restore-keys: ${{ steps.kunci_apt.outputs.awalan }}
      # Browser Playwright (±170 MB; unduhan ±15-20 s per job, diukur di run 40148968969) di ~/.cache/ms-playwright (keputusan 865).
      # Kunci: image runner dan versi playwright-core; tanpa restore-keys, karena direktori browser versi lain tidak terpakai.
      # `playwright install` melewati unduhan bila direktori browser versi ini sudah lengkap, dan tetap memasang dependency sistem
      # lewat apt di langkah di bawah. Isi cache tidak diverifikasi hash (Playwright tidak menerbitkan hash browser); cache yang
      # dibuat PR hanya terbaca PR itu, jadi cache yang dipakai PR lain berasal dari run main.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.kunci_apt.outputs.kunci_browser }}
      # apt-get memakai .deb di /var/cache/apt/archives yang nama file (paket_versi_arsitektur) dan ukurannya cocok
      # dengan index tanpa memeriksa hash (apt 2.8.3, konstruktor pkgAcqArchive di acquire-item.cc), lalu hanya
      # mengunduh sisanya. Isi cache Actions tidak ditandatangani, jadi setiap .deb dicocokkan dulu dengan SHA256
      # di index apt yang ditandatangani; yang tidak cocok tidak disalin dan diunduh apt dari mirror (keputusan 684).
      # Perintah install tetap milik Playwright, jadi daftar paket yang terpasang, termasuk font fallback, sama
      # dengan tanpa cache.
      - name: Pasang Chromium Playwright
        run: |
          shopt -s nullglob
          deb=(~/apt-chromium/*.deb)
          cocok=0 lama=0 beda=0
          if (( ${#deb[@]} )); then
            timeout -k 15s 3m sudo apt-get update -qq
            for f in "${deb[@]}"; do
              nama=$(basename "$f" .deb)
              paket=${nama%%_*}; versi=${nama#*_}; versi=${versi%_*}; versi=${versi//%3a/:}
              index=$(apt-cache show "$paket=$versi" 2>/dev/null | grep '^SHA256: ' || true)
              if [ -z "$index" ]; then lama=$((lama+1)); continue; fi
              if grep -qx "SHA256: $(sha256sum "$f" | cut -d' ' -f1)" <<<"$index"; then
                sudo cp "$f" /var/cache/apt/archives/; cocok=$((cocok+1))
              else
                beda=$((beda+1))
              fi
            done
          fi
          echo "Dari cache: ${#deb[@]} file .deb; $cocok cocok dengan index apt, $lama versinya tidak ada lagi di index, $beda berbeda"
          (( beda == 0 )) || echo "::warning::$beda file .deb dari cache berbeda dengan SHA256 di index apt dan tidak dipakai"
          cd situs && timeout -k 15s 8m bunx playwright install --with-deps chromium
      # Hanya bila kunci persis belum ada. Yang disimpan hanya .deb yang versinya sekarang terpasang, supaya versi
      # lama dari restore-keys tidak menumpuk. actions/cache mengunggahnya di akhir job, dan hanya bila job lolos.
      - name: Siapkan cache apt Chromium
        if: steps.cache_apt.outputs.cache-hit != 'true'
        run: |
          shopt -s nullglob
          rm -rf ~/apt-chromium && mkdir ~/apt-chromium
          for f in /var/cache/apt/archives/*.deb; do
            paket=$(dpkg-deb -f "$f" Package)
            versi=$(dpkg-deb -f "$f" Version)
            terpasang=$(dpkg-query -W -f='${Version}' "$paket" 2>/dev/null || true)
            if [ "$terpasang" = "$versi" ]; then cp "$f" ~/apt-chromium/; fi
          done
          deb=(~/apt-chromium/*.deb)
          echo "Disiapkan untuk cache: ${#deb[@]} file .deb, $(du -sh ~/apt-chromium | cut -f1)"
          (( ${#deb[@]} )) || echo "::warning::Tidak ada .deb terpasang di /var/cache/apt/archives; cache apt kosong"
      # Font sudah ada di dist (get_fonts.sh menyalinnya ke situs/public sebelum build).
      - uses: actions/download-artifact@v8
        with:
          name: situs-dist
          path: situs/dist
      # Halaman yang diperiksa (keputusan 866): bila mode "sebagian", UKUR_HALAMAN menunjuk berkas daftar halaman dan alat ukur
      # yang memeriksa semua halaman hanya memeriksa daftar itu; bila "semua", variabelnya tidak ada. Berkas yang hilang saat
      # mode sebagian menggagalkan job, bukan diam-diam memeriksa semua atau tidak sama sekali.
      - uses: actions/download-artifact@v8
        with:
          name: pilihan-halaman
          path: pilihan
      - name: Halaman yang diperiksa
        run: |
          cat pilihan/ringkasan.txt
          if [ "$(cat pilihan/mode.txt)" = sebagian ]; then
            test -f pilihan/halaman-diperiksa.txt
            echo "UKUR_HALAMAN=$GITHUB_WORKSPACE/pilihan/halaman-diperiksa.txt" >> "$GITHUB_ENV"
          fi
      # 13 menit di bawah timeout job 18 menit, supaya alat yang macet membuat job gagal, bukan cancelled
      # (naik dari 9 menit pada 2026-10-25, keputusan 726: gerak tumbuh tiap halaman berblok baru)
      # (lihat langkah gerbang di job build).
      - name: Alat ukur
        env:
          KELOMPOK: ${{ matrix.kelompok }}
        run: timeout -k 30s 13m bash tools/cek_situs.sh --ukur "$KELOMPOK"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tangkapan-situs-${{ strategy.job-index }}
          path: situs/tangkapan/*.png
          if-no-files-found: ignore
          retention-days: 7

  # Cloudflare Pages lewat Direct Upload (keputusan 115). Setiap PR mendapat preview per branch; push ke main = produksi.
  # Butuh dua secret repo: CLOUDFLARE_API_TOKEN (izin Account > Cloudflare Pages > Edit) dan CLOUDFLARE_ACCOUNT_ID.
  # Tanpa secret (belum disiapkan, atau PR dari fork) job ini lewat tanpa gagal.
  # Sumber: https://developers.cloudflare.com/pages/how-to/use-direct-upload-with-continuous-integration/
  deploy:
    name: deploy Cloudflare Pages
    needs: [situs_baru, situs_ukur]
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      PROYEK: rekeningo-tech-journey
    steps:
      - name: Cek secret Cloudflare
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AKUN: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$AKUN" ]; then echo "ada=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Secret Cloudflare belum ada; deploy dilewati."; echo "ada=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v8
        if: steps.cf.outputs.ada == 'true'
        with:
          name: situs-dist
          path: dist
      - uses: cloudflare/wrangler-action@v4.1.3
        id: wrangler
        if: steps.cf.outputs.ada == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.148.0"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Proyek dibuat sekali bila belum ada; perintah ini gagal tanpa efek bila proyek sudah ada.
          preCommands: npx wrangler pages project create "$PROYEK" --production-branch=main || true
          command: pages deploy dist --project-name=${{ env.PROYEK }} --branch=${{ github.head_ref || github.ref_name }}
      - name: Tulis URL preview di PR
        if: steps.cf.outputs.ada == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.wrangler.outputs.deployment-url }}
          ALIAS: ${{ steps.wrangler.outputs.pages-deployment-alias-url }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
            --body "Preview situs: ${ALIAS:-$URL} (commit ${{ github.event.pull_request.head.sha }}, deploy ${URL})"
