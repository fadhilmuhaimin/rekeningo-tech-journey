# Gerbang kualitas yang sama dengan laptop, dijalankan di setiap PR dan setiap push ke main.
# Job situs menjalankan `tools/cek_situs.sh --layar` (keputusan 111); yang disiapkan di sini hanya
# lingkungannya (Node 22, bun, Chromium Playwright, font). MkDocs dihapus (keputusan 112).
# Versi action dicek ke halaman rilis masing-masing pada 2026-10-08 (keputusan 99).
name: cek

on:
  pull_request:
  push:
    branches: [main, 'percobaan/**']   # branch percobaan ikut dicek tanpa membuka PR
  workflow_dispatch:

concurrency:
  group: cek-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pesan_commit:
    name: pesan commit
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # butuh seluruh commit PR, bukan hanya HEAD
      # CLAUDE.md "commit": tanpa trailer Co-Authored-By dan tanpa tanda alat AI (keputusan 110).
      # "Claude" dicari peka huruf besar supaya nama file CLAUDE.md di pesan tetap boleh.
      - name: Tolak trailer dan tanda AI di pesan commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gagal=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            pesan=$(git log -1 --format=%B "$sha")
            if printf '%s' "$pesan" | grep -qiE 'co-authored-by' || printf '%s' "$pesan" | grep -qE 'Claude'; then
              echo "::error::Pesan commit $sha mengandung Co-Authored-By atau Claude"
              printf '%s\n' "$pesan"
              gagal=1
            fi
          done
          exit $gagal

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # memindai seluruh riwayat, bukan hanya commit terakhir
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  situs_baru:
    name: situs (Astro)
    runs-on: ubuntu-latest
    # Job di main 13m54-14m51 sebelum K2a; batas 15 menit memotong run PR #189 (keputusan 354).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Node tetap dipakai untuk astro, Playwright, dan node:test; bun hanya pemasang paket
      # dan penjalan skrip (keputusan 225). Versi bun dipin sama dengan yang membuat bun.lock.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Unduh font
        run: bash tools/get_fonts.sh
      - name: Pasang dependency
        run: bun install --cwd situs --frozen-lockfile
      - name: Pasang Chromium Playwright
        run: cd situs && bunx playwright install --with-deps chromium
      # Satu skrip untuk laptop dan CI: registry, istilah, audit bahasa, build strict, ID internal,
      # kontras dua mode, tes, layar pertama 4 ukuran, tangkapan 2 ukuran x 2 mode (keputusan 111).
      - name: Gerbang kualitas situs
        run: bash tools/cek_situs.sh --layar
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tangkapan-situs
          path: situs/tangkapan/*.png
          retention-days: 7
      # Hasil build yang sudah lolos gerbang dipakai job deploy, supaya yang di-deploy sama dengan yang diperiksa.
      - uses: actions/upload-artifact@v7
        with:
          name: situs-dist
          path: situs/dist
          retention-days: 3

  # Cloudflare Pages lewat Direct Upload (keputusan 115). Setiap PR mendapat preview per branch; push ke main = produksi.
  # Butuh dua secret repo: CLOUDFLARE_API_TOKEN (izin Account > Cloudflare Pages > Edit) dan CLOUDFLARE_ACCOUNT_ID.
  # Tanpa secret (belum disiapkan, atau PR dari fork) job ini lewat tanpa gagal.
  # Sumber: https://developers.cloudflare.com/pages/how-to/use-direct-upload-with-continuous-integration/
  deploy:
    name: deploy Cloudflare Pages
    needs: situs_baru
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      PROYEK: rekeningo-tech-journey
    steps:
      - name: Cek secret Cloudflare
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AKUN: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$AKUN" ]; then echo "ada=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Secret Cloudflare belum ada; deploy dilewati."; echo "ada=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v8
        if: steps.cf.outputs.ada == 'true'
        with:
          name: situs-dist
          path: dist
      - uses: cloudflare/wrangler-action@v4.1.3
        id: wrangler
        if: steps.cf.outputs.ada == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.148.0"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Proyek dibuat sekali bila belum ada; perintah ini gagal tanpa efek bila proyek sudah ada.
          preCommands: npx wrangler pages project create "$PROYEK" --production-branch=main || true
          command: pages deploy dist --project-name=${{ env.PROYEK }} --branch=${{ github.head_ref || github.ref_name }}
      - name: Tulis URL preview di PR
        if: steps.cf.outputs.ada == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.wrangler.outputs.deployment-url }}
          ALIAS: ${{ steps.wrangler.outputs.pages-deployment-alias-url }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
            --body "Preview situs: ${ALIAS:-$URL} (commit ${{ github.event.pull_request.head.sha }}, deploy ${URL})"
